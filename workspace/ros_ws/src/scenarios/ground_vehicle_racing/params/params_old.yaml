        init_acc: 0.0
        init_alpha: 0.0
        collision_foot_print_major_axis: 0.8
        collision_foot_print_minor_axis: 0.4
        pos_inf_noise:
          enable: false
          type: "normal"
          min_noise: -0.05
          max_noise: +0.05
          mean_noise: 1e-6
          std_dev: 0.01
          seed: 373
        vel_inf_noise:
          enable: false
          type: "normal"
          min_noise: -0.05
          max_noise: +0.05
          mean_noise: 1e-6
          std_dev: 0.01
          seed: 1473  

      agent_3:
        position: [+0.0, -0.8, 0.0, 3.14]  # [x, y, z, yaw]
        type: "differential"
        shape: "recatangle"
        footprint:
          footprint_shape: "rectangle"
          footprint_radius: 0.8
          footprint_color: [1.0, 0.0, 0.0, 1.0]
          footprint_vis_width: 0.8
        color: [0.0, 1.0, 0.0, 1.0]
        pref_velocity: [-0.2, 0.0]
        goal: [0.0, 0.0, 0.0, 0.0]
        publish_debug_msg: false
        # vehicle dynamics params (differential drive)
        num_states: 5
