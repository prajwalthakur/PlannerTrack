/**:
  ros__parameters:
    x_lim: [-17,17]
    y_lim: [-10,10]
    # vx_lim: [-1.2,1.2]
    # vy_lim: [-1.2,1.2]
    #model_dt: 0.01 #update the model with this time step
    sim_dt: 0.01  # update the rvo algo with this rate

    # Robot physical parameters (shared across all nodes) (amr 200)
    cbf:
      lf: 1.2
      lr: 1.2
      wheel_base: 2.4
      robot_width: 2.4
      robot_length: 2.4
      lane_width: 3.4


    # Motion limits (shared across all nodes)
    FollowPath:
      vx_max: 1.5 
      vx_min: -0.5
      vy_max: 0.0
      wz_max: 1.0
      wz_min: -1.0
      ax_max: 0.6 
      ax_min: -0.6 
      az_max: 1.5 


    agents:
      num_agents: 2
      vx_max: 1.5 
      vx_min: -0.5 
      vy_max: 0.0
      wz_max: 1.0
      wz_min: -1.0
      ax_max: 0.6 
      ax_min: -0.6 
      az_max: 1.5 
      lf: 1.2
      lr: 1.2
      wheel_base: 2.4
      robot_width: 2.4
      robot_length: 2.4

      agent_1:
        position: [-14.0, +1.7, 0.0, 0.0]  # [x, y, z, yaw]
        type: "differential"
        shape: "recatangle"
        footprint:
          footprint_shape: "rectangle"
          footprint_radius: 0.8
          footprint_color: [1.0, 0.0, 0.0, 1.0]
          footprint_vis_width: 0.8
        color: [0.0, 0.0, 1.0, 1.0]
        pref_velocity: [0.2, 0.0]
        goal: [6.0, 0.0, 0.0, 0.0]
        publish_debug_msg: true
        # vehicle dynamics params (differential drive)
        num_states: 5
        num_control_inputs: 2
        init_vx: 0.0
        init_wz: 0.0
        init_acc: 0.0
        init_alpha: 0.0
        collision_foot_print_major_axis: 0.8
        collision_foot_print_minor_axis: 0.4
        pos_inf_noise:
          enable: false
          type: "normal"
          min_noise: -0.05
          max_noise: +0.05
          mean_noise: 1e-6
          std_dev: 0.01
          seed: 173
        vel_inf_noise:
          enable: false
          type: "normal"
          min_noise: -0.05
          max_noise: +0.05
          mean_noise: 1e-6
          std_dev: 0.01
          seed: 273

      agent_2:
