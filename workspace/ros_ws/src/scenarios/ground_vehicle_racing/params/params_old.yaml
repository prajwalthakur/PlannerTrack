          seed: 1473  
     
          
    corridor:
      num_lines: 2
      # upper wall
      line_1:
        start: [-14.0, -3.4]
        end: [14.0, -3.4]
        width: 0.02
        color: [0.0, 0.0, 0.0, 1.0]

      # lower wall
      line_2:
        start: [-14.0, +3.4]
        end: [14.0, +3.4]
        width: 0.02
        color: [0.0, 0.0, 0.0, 1.0]

    Lanes:
      num_lanes: 2
      # upper lane
      lane_1:
        start: [-14.0, -1.7]
        end: [14.0, -1.7]
        width: 3.4
        color: [0.0, 0.0, 0.0, 1.0]

      # lower lane
      lane_2:
        start: [-14.0, +1.7]
        end: [14.0, +1.7]
        width: 3.4
        color: [0.0, 0.0, 0.0, 1.0]


    agent_interface:
      model_step_dt: 0.001              # state integration step (s)
      integration_step_size: 0.001
      state_publisher_dt: 0.01  # odom/TF publish rate (s)
      fixed_frame: "odom"
    pid:
      kp_v: 3.0        # moderate — smooth response, ts ≈ 1.3s
      ki_v: 0.3        # eliminate steady state error slowly
      kd_v: 0.02       # small derivative, noise safe at 1000 Hz
      kp_w: 3.0        # same for angular
      ki_w: 0.2
      kd_w: 0.02
      acc_max: 1.0    # match your robot ax_max from yaml
      alpha_max: 0.7   # match your robot az_max
    
    visualization:
        vis_dt: 0.05 # update the plot with this rate

    lidar:
      vis_dt: 0.1          # scan publish rate (seconds)
      num_beams: 360        # number of rays per scan
      angle_min: -3.14159265358979   # start angle relative to agent heading (rad)
      angle_max:  3.14159265358979   # end angle relative to agent heading (rad)
      range_min: 0.05       # minimum valid range (m)
      range_max: 5.0       # maximum valid range / no-hit value (m)

    obstacles:
      type: "circle"
      num_obstacles: 6
      obstacle_1:
        position: [-4.0, 3.4, 0.0, -1.57]
        radius: 0.4
        color: [1.0, 0.0, 0.0, 1.0]

      obstacle_2:
        position: [-2.0, 3.0, 0.0, -1.57]
        radius: 0.4
        color: [1.0, 0.0, 0.0, 1.0]
      
      obstacle_3:
